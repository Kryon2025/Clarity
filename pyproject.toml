[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shenqing"
version = "0.15.0"
description = "深清（身轻）— Windows 专注锁机工具"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.8,<7",
    "RinUI==0.4.4.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.6", "ruff>=0.5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shenqing = [
    "qml/**/*.qml",
    "locales/*.qm",
    "qml/**/*.js",
    "qml/**/*.png",
    "qml/**/*.qsb",
    "qml/**/*.frag",
    "qml/**/*.vert",
    "plugins/builtin/*/*.json",
    "plugins/builtin/**/*.qml",
    "plugins/builtin/*/*.py",
    "plugins/builtin/*/*.md",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
